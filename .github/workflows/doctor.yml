name: NexusLeads Full-Stack Doctor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "cloudflare/**"
      - "backend/**"
      - ".github/workflows/**"

permissions:
  contents: write
  actions: read

concurrency:
  group: nexusleads-doctor
  cancel-in-progress: true

env:
  LIVE_FRONTEND_URL: https://leads.sayadbayezid.com/
  LIVE_API_URL: https://nexusleads-api.mahmudajenny6.workers.dev
  WORKER_NAME: nexusleads-api
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_AC_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}

jobs:
  doctor:
    name: Full-Stack Root Cause Doctor
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. SOURCE
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. NODE / PYTHON
      # ==========================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Doctor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyyaml

          npm install --global wrangler

          npm init -y
          npm install playwright

          npx playwright install --with-deps chromium

      # ==========================================================
      # 3. REPORT DIRECTORY
      # ==========================================================

      - name: Prepare Doctor report
        run: |
          mkdir -p doctor
          rm -rf doctor-report
          mkdir -p doctor-report/history
          mkdir -p doctor-report/raw
          mkdir -p doctor-report/screenshots

          echo "Doctor report initialized."

      # ==========================================================
      # 4. BASIC SOURCE DISCOVERY
      # ==========================================================

      - name: Discover source files
        shell: bash
        run: |
          find frontend cloudflare backend .github/workflows \
            -type f \
            \( -name "*.js" -o \
               -name "*.html" -o \
               -name "*.py" -o \
               -name "*.toml" -o \
               -name "*.yml" -o \
               -name "*.yaml" \) \
            | sort \
            > doctor-report/raw/source-files.txt

      # ==========================================================
      # 5. STATIC ROUTE DISCOVERY
      # ==========================================================

      - name: Discover application routes
        shell: bash
        run: |
          {
            echo "=== JavaScript Routes ==="

            grep -RniE \
              "fetch\(|axios|/api/|Request\(|Response\(" \
              frontend cloudflare backend \
              --include="*.js" \
              --include="*.html" \
              --include="*.py" \
              || true

            echo
            echo "=== Authentication Indicators ==="

            grep -RniE \
              "login|register|signup|sign.?up|signin|sign.?in|auth|password|session|token" \
              frontend cloudflare backend \
              --include="*.js" \
              --include="*.html" \
              --include="*.py" \
              || true
          } > doctor-report/raw/routes-and-auth.txt

      # ==========================================================
      # 6. STATIC SECRET REFERENCE DISCOVERY
      # ==========================================================

      - name: Discover secret references
        shell: bash
        run: |
          grep -RohE \
            "(CLOUDFLARE_[A-Z0-9_]+|GOOGLE_[A-Z0-9_]+|FIRECRAWL_[A-Z0-9_]+|GEMINI_[A-Z0-9_]+|GEEKFLARE_[A-Z0-9_]+)" \
            frontend cloudflare backend .github \
            --include="*.js" \
            --include="*.html" \
            --include="*.py" \
            --include="*.toml" \
            --include="*.yml" \
            --include="*.yaml" \
            2>/dev/null \
            | sort -u \
            > doctor-report/raw/secret-references.txt || true

      # ==========================================================
      # 7. SECRET STATUS
      # ==========================================================

      - name: Check required secret status
        shell: bash
        env:
          GOOGLE_MAP_API_NEW: ${{ secrets.GOOGLE_MAP_API_NEW }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEEKFLARE_API_KEY: ${{ secrets.GEEKFLARE_API_KEY }}
        run: |
          {
            echo "CLOUDFLARE_AC_ID=$( [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo PRESENT || echo MISSING )"
            echo "CLOUDFLARE_API_KEY=$( [ -n "$CLOUDFLARE_API_TOKEN" ] && echo PRESENT || echo MISSING )"
            echo "GOOGLE_MAP_API_NEW=$( [ -n "$GOOGLE_MAP_API_NEW" ] && echo PRESENT || echo MISSING )"
            echo "GOOGLE_SERVICE_ACCOUNT_JSON=$( [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && echo PRESENT || echo MISSING )"
            echo "GOOGLE_SHEET_ID=$( [ -n "$GOOGLE_SHEET_ID" ] && echo PRESENT || echo MISSING )"
            echo "FIRECRAWL_API_KEY=$( [ -n "$FIRECRAWL_API_KEY" ] && echo PRESENT || echo MISSING )"
            echo "GEMINI_API_KEY=$( [ -n "$GEMINI_API_KEY" ] && echo PRESENT || echo MISSING )"
            echo "GEEKFLARE_API_KEY=$( [ -n "$GEEKFLARE_API_KEY" ] && echo PRESENT || echo MISSING )"
          } > doctor-report/raw/secrets-status.txt

      # ==========================================================
      # 8. CLOUDFLARE CONNECTION
      # ==========================================================

      - name: Check Cloudflare authentication
        shell: bash
        run: |
          set +e

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "FAIL|Cloudflare Account ID secret is missing" \
              > doctor-report/raw/cloudflare-auth.txt
            exit 0
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "FAIL|Cloudflare API token secret is missing" \
              > doctor-report/raw/cloudflare-auth.txt
            exit 0
          fi

          wrangler whoami \
            > doctor-report/raw/cloudflare-auth.txt 2>&1

          if [ "$?" -eq 0 ]; then
            echo "PASS|Cloudflare authentication successful" \
              >> doctor-report/raw/cloudflare-auth.txt
          else
            echo "FAIL|Cloudflare authentication failed" \
              >> doctor-report/raw/cloudflare-auth.txt
          fi

      # ==========================================================
      # 9. CLOUDFLARE RESOURCES
      # ==========================================================

      - name: Inspect Cloudflare resources
        shell: bash
        run: |
          set +e

          wrangler d1 list \
            > doctor-report/raw/cloudflare-d1.txt 2>&1

          wrangler r2 bucket list \
            > doctor-report/raw/cloudflare-r2.txt 2>&1

          wrangler kv namespace list \
            > doctor-report/raw/cloudflare-kv.txt 2>&1

          wrangler deployments list \
            --name "$WORKER_NAME" \
            > doctor-report/raw/cloudflare-worker-deployments.txt 2>&1

      # ==========================================================
      # 10. WRANGLER CONFIGURATION
      # ==========================================================

      - name: Inspect Wrangler configuration
        shell: bash
        run: |
          if [ -f cloudflare/wrangler.toml ]; then
            cp cloudflare/wrangler.toml \
              doctor-report/raw/wrangler.toml

            grep -nE \
              "name|main|compatibility_date|account_id|d1|r2|kv|vars|routes|workers_dev" \
              cloudflare/wrangler.toml \
              > doctor-report/raw/wrangler-analysis.txt || true
          else
            echo "FAIL|cloudflare/wrangler.toml missing" \
              > doctor-report/raw/wrangler-analysis.txt
          fi

      # ==========================================================
      # 11. LIVE API DISCOVERY
      # ==========================================================

      - name: Inspect live API
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from pathlib import Path

          base = "${{ env.LIVE_API_URL }}"

          endpoints = [
              "/",
              "/health",
              "/api/health",
              "/api",
              "/docs",
              "/openapi.json",
          ]

          output = []

          for endpoint in endpoints:
              url = base.rstrip("/") + endpoint

              try:
                  response = requests.get(
                      url,
                      timeout=20,
                      allow_redirects=True
                  )

                  output.append(
                      f"{endpoint}|HTTP {response.status_code}|"
                      f"{response.headers.get('content-type','unknown')}"
                  )

              except Exception as exc:
                  output.append(
                      f"{endpoint}|ERROR|{type(exc).__name__}"
                  )

          Path("doctor-report/raw/live-api.txt").write_text(
              "\n".join(output)
          )
          PY

      # ==========================================================
      # 12. PLAYWRIGHT LIVE FRONTEND DOCTOR
      # ==========================================================

      - name: Run browser Doctor
        shell: bash
        run: |
          cat > doctor/browser-doctor.js <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const FRONTEND = process.env.LIVE_FRONTEND_URL;
          const API = process.env.LIVE_API_URL;

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext({
              ignoreHTTPSErrors: false
            });

            const page = await context.newPage();

            const result = {
              url: FRONTEND,
              page: {
                status: null,
                title: null
              },
              consoleErrors: [],
              pageErrors: [],
              failedRequests: [],
              responses: [],
              forms: [],
              buttons: [],
              inputs: [],
              apiRequests: [],
              screenshots: [],
              authChecks: {}
            };

            page.on("console", message => {
              if (message.type() === "error") {
                result.consoleErrors.push(message.text());
              }
            });

            page.on("pageerror", error => {
              result.pageErrors.push(String(error));
            });

            page.on("requestfailed", request => {
              result.failedRequests.push({
                url: request.url(),
                method: request.method(),
                failure: request.failure()
              });
            });

            page.on("response", response => {
              const url = response.url();

              if (
                url.includes("/api/") ||
                url.includes(API)
              ) {
                result.apiRequests.push({
                  url,
                  status: response.status(),
                  method: response.request().method()
                });
              }

              if (response.status() >= 400) {
                result.responses.push({
                  url,
                  status: response.status(),
                  method: response.request().method()
                });
              }
            });

            try {
              const response = await page.goto(
                FRONTEND,
                {
                  waitUntil: "networkidle",
                  timeout: 60000
                }
              );

              result.page.status = response
                ? response.status()
                : null;

              result.page.title = await page.title();

              result.forms = await page.locator("form").evaluateAll(
                forms => forms.map((form, index) => ({
                  index,
                  action: form.action,
                  method: form.method,
                  id: form.id,
                  name: form.getAttribute("name")
                }))
              );

              result.buttons = await page.locator("button").evaluateAll(
                buttons => buttons.map((button, index) => ({
                  index,
                  text: button.innerText,
                  type: button.type,
                  id: button.id,
                  disabled: button.disabled
                }))
              );

              result.inputs = await page.locator("input").evaluateAll(
                inputs => inputs.map((input, index) => ({
                  index,
                  type: input.type,
                  name: input.name,
                  id: input.id,
                  placeholder: input.placeholder
                }))
              );

              await page.screenshot({
                path: "doctor-report/screenshots/homepage.png",
                fullPage: true
              });

              result.screenshots.push(
                "doctor-report/screenshots/homepage.png"
              );

            } catch (error) {
              result.pageErrors.push(String(error));

              try {
                await page.screenshot({
                  path: "doctor-report/screenshots/frontend-failure.png",
                  fullPage: true
                });

                result.screenshots.push(
                  "doctor-report/screenshots/frontend-failure.png"
                );
              } catch {}
            }

            /*
             * Safe authentication diagnostics.
             * These probes never create an account and never use real credentials.
             * Invalid payloads are intentional: they only verify that the browser
             * can reach the endpoint and receive a normal JSON response.
             */
            for (const [mode, endpoint, payload] of [
              ["signup", "/api/auth/signup", { email: "doctor-invalid-email", password: "x" }],
              ["login", "/api/auth/login", { email: "doctor-invalid@example.invalid", password: "wrong-password" }]
            ]) {
              try {
                const probe = await page.evaluate(async ({ apiBase, endpoint, payload }) => {
                  try {
                    const response = await fetch(apiBase + endpoint, {
                      method: "POST",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify(payload),
                      credentials: "omit"
                    });
                    const body = await response.text();
                    return { status: response.status, body: body.slice(0, 300) };
                  } catch (error) {
                    return { blocked: true, error: String(error) };
                  }
                }, { apiBase: API, endpoint, payload });
                result.authChecks[mode] = { endpoint, ...probe };
              } catch (error) {
                result.authChecks[mode] = { endpoint, blocked: true, error: String(error) };
              }
            }

            const authText = await page.locator("body").innerText()
              .catch(() => "");

            result.authIndicators = {
              login:
                /login|sign in|signin/i.test(authText),

              register:
                /register|sign up|signup|create account/i.test(authText)
            };

            fs.writeFileSync(
              "doctor-report/raw/browser.json",
              JSON.stringify(result, null, 2)
            );

            await browser.close();
          })();
          NODE

          LIVE_FRONTEND_URL="$LIVE_FRONTEND_URL" \
          LIVE_API_URL="$LIVE_API_URL" \
          node doctor/browser-doctor.js

      # ==========================================================
      # 13. AUTH / REGISTER DISCOVERY
      # ==========================================================

      - name: Analyze authentication implementation
        shell: bash
        run: |
          {
            echo "=== AUTHENTICATION SOURCE ANALYSIS ==="

            grep -RniE \
              "register|signup|sign.?up|create.?account|login|signin|sign.?in|password|auth" \
              frontend cloudflare backend \
              --include="*.js" \
              --include="*.html" \
              --include="*.py" \
              || true

            echo
            echo "=== FORM SUBMISSION ANALYSIS ==="

            grep -RniE \
              "fetch\(|axios|XMLHttpRequest|addEventListener.*submit|onsubmit" \
              frontend cloudflare backend \
              --include="*.js" \
              --include="*.html" \
              --include="*.py" \
              || true

          } > doctor-report/raw/auth-source-analysis.txt

      # ==========================================================
      # 14. STATIC JAVASCRIPT ERROR PATTERNS
      # ==========================================================

      - name: Static source diagnostics
        shell: bash
        run: |
          {
            echo "=== TODO / FIXME ==="

            grep -RniE \
              "TODO|FIXME|HACK|XXX" \
              frontend cloudflare backend \
              --include="*.js" \
              --include="*.html" \
              --include="*.py" \
              || true

            echo
            echo "=== COMMON RUNTIME RISK PATTERNS ==="

            grep -RniE \
              "undefined|null|localStorage|sessionStorage|JSON.parse|JSON.stringify|\.env|process\.env|env\." \
              frontend cloudflare backend \
              --include="*.js" \
              --include="*.html" \
              --include="*.py" \
              || true

          } > doctor-report/raw/static-diagnostics.txt

      # ==========================================================
      # 15. GITHUB WORKFLOW ANALYSIS
      # ==========================================================

      - name: Analyze GitHub Actions
        shell: bash
        run: |
          {
            echo "=== WORKFLOWS ==="

            find .github/workflows \
              -type f \
              \( -name "*.yml" -o -name "*.yaml" \) \
              -print \
              | sort

            echo
            echo "=== DEPLOYMENT REFERENCES ==="

            grep -RniE \
              "wrangler|cloudflare|deploy|pages|workers|secret|environment" \
              .github/workflows \
              --include="*.yml" \
              --include="*.yaml" \
              || true

          } > doctor-report/raw/github-actions-analysis.txt

      # ==========================================================
      # 16. ROOT-CAUSE CORRELATION ENGINE
      # ==========================================================

      - name: Generate root cause report
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          report_dir = Path("doctor-report")
          raw = report_dir / "raw"
          browser = {}
          browser_file = raw / "browser.json"
          if browser_file.exists():
              try:
                  browser = json.loads(browser_file.read_text())
              except Exception:
                  browser = {}

          issues = []

          def add_issue(issue_id, severity, title, reason, file_path="Not established", line="Not established", action="Review the evidence in this report."):
              issues.append({
                  "id": issue_id,
                  "severity": severity,
                  "title": title,
                  "reason": reason,
                  "file": file_path,
                  "line": line,
                  "action": action,
              })

          def source_for_url(url):
              path = urlparse(url).path
              if path.endswith("/api/auth/signup"):
                  return ("frontend/app.js", "313-324", "The frontend sends the signup request here. Also check cloudflare/worker.js:391-408 for the backend handler.")
              if path.endswith("/api/auth/login"):
                  return ("frontend/app.js", "313-324", "The frontend sends the login request here. Also check cloudflare/worker.js:411-424 for the backend handler.")
              if path.endswith("/api/auth/me"):
                  return ("frontend/app.js", "188-196", "The frontend validates the saved session token here.")
              if path.startswith("/api/"):
                  return ("frontend/app.js", "61-67", "The frontend sends API requests through this helper; inspect the matching route in cloudflare/worker.js.")
              return ("Not established", "Not established", "The failure was observed in the browser, but no unique source line can be proven from this evidence.")

          page = browser.get("page", {})
          page_status = page.get("status")
          if page_status and page_status >= 400:
              add_issue("FRONTEND-HTTP", "CRITICAL", "The live website cannot be opened", f"The frontend returned HTTP {page_status}.", "frontend/index.html", "1-500", "Open the frontend deployment and fix the HTTP error before checking login.")

          for index, error in enumerate(browser.get("consoleErrors", []), 1):
              add_issue(f"BROWSER-CONSOLE-{index}", "HIGH", "The browser printed an error", error, "frontend/index.html or frontend/app.js", "Not established", "Open the browser console message and fix the referenced JavaScript or network request.")

          for index, error in enumerate(browser.get("pageErrors", []), 1):
              add_issue(f"BROWSER-RUNTIME-{index}", "HIGH", "The page JavaScript crashed", error, "frontend/app.js", "Not established", "Use the error text to locate the failing function, then rerun Doctor.")

          failed_api = [
              item for item in browser.get("failedRequests", [])
              if "/api/" in item.get("url", "")
          ]
          failed_external = [
              item for item in browser.get("failedRequests", [])
              if "/api/" not in item.get("url", "")
              and "google-analytics.com" not in item.get("url", "")
          ]
          if failed_api:
              examples = "; ".join(
                  f"{item.get('method', 'REQUEST')} {item.get('url', '')}"
                  for item in failed_api[:3]
              )
              add_issue(
                  "NETWORK-API-GROUP", "CRITICAL", "The browser cannot reach the API",
                  f"{len(failed_api)} API request(s) failed in the browser. Examples: {examples}. This is consistent with a cross-origin/CORS problem from the custom domain.",
                  "cloudflare/wrangler.toml", "21",
                  "Add https://leads.sayadbayezid.com to ALLOWED_ORIGINS, deploy the Worker, then run Doctor again. The CORS code is in cloudflare/worker.js:573-589.")
          if failed_external:
              examples = "; ".join(item.get("url", "") for item in failed_external[:3])
              add_issue(
                  "NETWORK-EXTERNAL-GROUP", "MEDIUM", "An external browser request failed",
                  f"{len(failed_external)} non-API request(s) failed. Examples: {examples}.",
                  "Not established", "Not established",
                  "Check the external service only if the website feature depends on it. This is not the login/signup root cause.")

          seen_http = set()
          for response in browser.get("responses", []):
              url = response.get("url", "")
              status = response.get("status")
              if "google-analytics.com" in url or status in (404, 400, 401):
                  continue
              key = (response.get("method"), url, status)
              if key in seen_http:
                  continue
              seen_http.add(key)
              file_path, line, action = source_for_url(url)
              severity = "CRITICAL" if status >= 500 else "HIGH"
              add_issue(f"HTTP-{len(seen_http)}", severity, f"The server returned HTTP {status}", f"{response.get('method', 'REQUEST')} {url} returned HTTP {status}.", file_path, line, action)

          # Authentication checks are intentionally safe invalid-payload checks.
          # Expected results: signup=400, login=401. Those statuses prove that
          # the browser reached the API and that CORS did not block the response.
          auth_checks = browser.get("authChecks", {})
          auth_summary = []
          for mode, expected in (("signup", 400), ("login", 401)):
              check = auth_checks.get(mode, {})
              status = check.get("status")
              endpoint = check.get("endpoint", f"/api/auth/{mode}")
              if check.get("blocked") or check.get("error"):
                  if not any(issue["id"] == "AUTH-CORS-GROUP" for issue in issues):
                      add_issue(
                          "AUTH-CORS-GROUP", "CRITICAL", "Login and signup are blocked by the browser",
                          "The browser could not receive a normal response from the auth endpoints. Because the live custom domain is calling the Worker API, the most likely cause is that the custom frontend origin is missing from the Worker CORS allowlist.",
                          "cloudflare/wrangler.toml", "21",
                          "Change ALLOWED_ORIGINS to include https://leads.sayadbayezid.com, deploy the Worker, and run Doctor again. The CORS code is in cloudflare/worker.js:573-589. Do not change frontend/app.js first.")
                  auth_summary.append((mode, "BLOCKED", "Browser could not read the API response; likely CORS."))
              elif status not in (expected, 409 if mode == "signup" else expected):
                  file_path, line, action = source_for_url(endpoint)
                  add_issue(
                      f"AUTH-{mode.upper()}", "CRITICAL" if status and status >= 500 else "HIGH", f"{mode.title()} endpoint returned an unexpected result",
                      f"The safe Doctor probe sent an intentionally invalid request and received HTTP {status}. Response: {check.get('body', '')}",
                      file_path, line, action)
                  auth_summary.append((mode, f"HTTP {status}", "Unexpected response; read the issue row below."))
              else:
                  auth_summary.append((mode, f"HTTP {status}", "Endpoint reachable; the invalid test was handled normally."))

          if not browser.get("authIndicators", {}).get("login"):
              add_issue("AUTH-UI-LOGIN", "HIGH", "The login control was not found", "The live page text did not contain a login label.", "frontend/index.html", "154-160", "Confirm that the login button and auth modal are present in the deployed frontend.")
          if not browser.get("authIndicators", {}).get("register"):
              add_issue("AUTH-UI-SIGNUP", "HIGH", "The signup control was not found", "The live page text did not contain a signup label.", "frontend/index.html", "154-160, 416-440", "Confirm that the Sign Up button and Create Account modal are present in the deployed frontend.")

          secret_status = raw / "secrets-status.txt"
          if secret_status.exists():
              for line in secret_status.read_text().splitlines():
                  if "= MISSING" in line:
                      name = line.split("=", 1)[0]
                      add_issue(f"SECRET-{name}", "HIGH", f"A workflow secret is missing: {name}", "This workflow could not see the required secret.", ".github/workflows/doctor.yml", "156-175", f"Add or correctly name the GitHub secret {name} if the related feature is required.")

          score = 100
          for issue in issues:
              score -= {"CRITICAL": 25, "HIGH": 15, "MEDIUM": 8, "LOW": 3}.get(issue["severity"], 0)
          score = max(0, min(100, score))
          overall = "CRITICAL" if any(i["severity"] == "CRITICAL" for i in issues) else "DEGRADED" if any(i["severity"] == "HIGH" for i in issues) else "HEALTHY"
          timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          frontend = os.environ.get("LIVE_FRONTEND_URL", "")
          backend = os.environ.get("LIVE_API_URL", "")

          report = {
              "doctor": "NexusLeads human-readable Doctor",
              "generated_at": timestamp,
              "frontend": frontend,
              "backend": backend,
              "overall_status": overall,
              "health_score": score,
              "issue_count": len(issues),
              "issues": issues,
              "auth_checks": auth_checks,
          }
          (report_dir / "latest.json").write_text(json.dumps(report, indent=2))

          lines = [
              "# NexusLeads Doctor — সহজ রিপোর্ট",
              "",
              f"**সার্বিক অবস্থা:** `{overall}`  ",
              f"**Health score:** `{score}/100`  ",
              f"**রিপোর্ট সময়:** `{timestamp}`  ",
              f"**Website checked:** `{frontend}`  ",
              f"**API checked:** `{backend}`",
              "",
              "> এই রিপোর্টের উদ্দেশ্য হলো আপনাকে raw log পড়তে না দেওয়া। নিচে সরাসরি বলা আছে: কী সমস্যা, কোন ফাইলে, কোন লাইনে, কেন হচ্ছে, এবং এখন কী করবেন।",
              "",
              "## Login ও নতুন account check",
              "",
              "| Check | ফলাফল | সহজ ব্যাখ্যা |",
              "|---|---|---|",
          ]
          if auth_summary:
              for mode, result, explanation in auth_summary:
                  lines.append(f"| `{mode}` | `{result}` | {explanation} |")
          else:
              lines.append("| login/signup | CHECK FAILED | Browser auth probe did not finish; see the issue table. |")
          lines += [
              "",
              "**গুরুত্বপূর্ণ:** Doctor account তৈরি করে না এবং কোনো real password ব্যবহার করে না। Signup-এর জন্য invalid email/short password এবং login-এর জন্য fake credentials পাঠানো হয়; এর উদ্দেশ্য শুধু browser-to-API connection ও CORS পরীক্ষা করা।",
              "",
              "## আগে এই সমস্যাগুলো ঠিক করুন",
              "",
          ]
          if not issues:
              lines.append("Doctor-এর বর্তমান checks-এ কোনো সমস্যা পাওয়া যায়নি।")
          else:
              lines += [
                  "| অগ্রাধিকার | সমস্যা | কোন file | কোন line | কেন হচ্ছে / কী করবেন |",
                  "|---|---|---|---|---|",
              ]
              for number, issue in enumerate(issues, 1):
                  reason = issue["reason"].replace("\n", " ").replace("|", "\\|")
                  action = issue["action"].replace("\n", " ").replace("|", "\\|")
                  detail = f"**কারণ:** {reason}<br>**করণীয়:** {action}"
                  lines.append(f"| {number}. `{issue['severity']}` | {issue['title']} | `{issue['file']}` | `{issue['line']}` | {detail} |")
          lines += [
              "",
              "## Source reference",
              "",
              "| বিষয় | Source location |",
              "|---|---|",
              "| Frontend auth request | `frontend/app.js:313-324` |",
              "| Backend signup | `cloudflare/worker.js:391-408` |",
              "| Backend login | `cloudflare/worker.js:411-424` |",
              "| CORS allowlist logic | `cloudflare/worker.js:573-589` |",
              "| Deployed origin allowlist | `cloudflare/wrangler.toml:20-23` |",
              "",
              "## কী পরীক্ষা হয়েছে",
              "",
              "Doctor live website HTTP status, browser console/runtime error, failed network request, API HTTP response, login/signup UI, safe auth endpoint response, Cloudflare authentication, Worker resources, source files, secrets status, এবং workflow configuration পরীক্ষা করেছে।",
              "",
              "## রিপোর্ট পড়ার নিয়ম",
              "",
              "- `CRITICAL` হলে আগে সেটি ঠিক করুন; সাধারণত website/API/CORS সম্পূর্ণভাবে আটকে আছে.",
              "- `HIGH` হলে feature কাজ নাও করতে পারে; report-এর file ও line দেখে পরিবর্তন করুন.",
              "- `Not established` মানে Doctor runtime evidence পেয়েছে, কিন্তু নির্দিষ্ট source line প্রমাণ করতে পারেনি—এ ক্ষেত্রে issue message-এ দেওয়া browser/API URL অনুসরণ করুন.",
              "- Login/signup-এর safe probe `HTTP 400` signup এবং `HTTP 401` login পেলে API reachable ও browser CORS কাজ করছে; তখন real account-এর ভুল email/password, existing account, বা database data আলাদা করে পরীক্ষা করতে হবে.",
              "",
              "**এই run-এর generated report:** `doctor-report/latest.md`",
          ]
          (report_dir / "latest.md").write_text("\n".join(lines) + "\n")
          print(f"Doctor report: {overall} ({score}/100), issues={len(issues)}")
          PY

      # ==========================================================
      # 17. GENERATE SOURCE LINE INDEX
      # ==========================================================

      - name: Generate source line index
        shell: bash
        run: |
          {
            echo "# Source Line Index"
            echo

            while IFS= read -r file; do
              echo "## $file"
              echo

              nl -ba "$file" \
                | sed -n '1,2500p' \
                | head -n 2500

              echo
            done < doctor-report/raw/source-files.txt

          } > doctor-report/raw/source-line-index.txt

      # ==========================================================
      # 18. UPLOAD DIAGNOSTIC ARTIFACT
      # ==========================================================

      - name: Upload readable Doctor report
        uses: actions/upload-artifact@v4
        with:
          name: nexusleads-doctor-readable-${{ github.run_id }}
          path: doctor-report/latest.md
          if-no-files-found: error
          retention-days: 14

      # ==========================================================
      # 19. GITHUB SUMMARY
      # ==========================================================

      - name: Publish Doctor summary
        shell: bash
        run: |
          cat doctor-report/latest.md >> "$GITHUB_STEP_SUMMARY"

      # ==========================================================
      # 20. COMMIT REPORT TO REPOSITORY
      # ==========================================================

      - name: Commit Doctor report
        shell: bash
        run: |
          git config user.name "NexusLeads Doctor"
          git config user.email "doctor@noreply.github.com"

          git add doctor-report/latest.md

          if git diff --cached --quiet; then
            echo "No Doctor report changes."
            exit 0
          fi

          git commit \
            -m "chore: update NexusLeads Doctor report"

          git push
