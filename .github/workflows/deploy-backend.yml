name: Deploy Cloudflare Worker & Sync Secrets

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_KEY }}
          accountId: ${{ secrets.CLOUDFLARE_AC_ID }}
          workingDirectory: 'cloudflare'
          wranglerVersion: 'latest'
          command: deploy --config wrangler-deploy.toml

      - name: Sync Secrets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_AC_ID }}
          GOOGLE_MAP_API_NEW: ${{ secrets.GOOGLE_MAP_API_NEW }}
          GOOGLE_MAP_API_NEW_2: ${{ secrets.GOOGLE_MAP_API_NEW_2 }}
          GOOGLE_MAP_API_NEW_3: ${{ secrets.GOOGLE_MAP_API_NEW_3 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_OUTREACH_API_KEY: ${{ secrets.GEMINI_OUTREACH_API_KEY }}
          GEEKFLARE_API_KEY: ${{ secrets.GEEKFLARE_API_KEY }}
          NEXUS_CREDENTIALS_KEY: ${{ secrets.NEXUS_CREDENTIALS_KEY }}
        run: |
          cd cloudflare
          for secret in GOOGLE_MAP_API_NEW GOOGLE_MAP_API_NEW_2 GOOGLE_MAP_API_NEW_3 GOOGLE_SERVICE_ACCOUNT_JSON GOOGLE_SHEET_ID FIRECRAWL_API_KEY GEMINI_API_KEY GEMINI_OUTREACH_API_KEY GEEKFLARE_API_KEY NEXUS_CREDENTIALS_KEY; do
            val="${!secret}"
            if [ -n "$val" ]; then
              echo "$val" | npx wrangler secret put "$secret" --config wrangler-deploy.toml || echo "Failed to set $secret"
            fi
          done
