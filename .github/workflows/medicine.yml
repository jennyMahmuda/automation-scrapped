name: NexusLeads Medicine — Safe Auto-Fix

on:
  workflow_run:
    workflows: ["NexusLeads Full-Stack Doctor"]
    types: [completed]
  workflow_dispatch:

# Safety contract:
# 1. This workflow never prints, stores, copies, or commits secret values.
# 2. It never changes passwords, databases, provider keys, or user data.
# 3. It changes only the exact, reversible CORS allowlist entry below when
#    doctor-report/latest.md proves that the custom-domain auth request is
#    blocked by CORS.
# 4. Every source change is committed so Git history is the rollback point.
# 5. Changelog synchronization is handled by the separate changelog-sync.yml.

permissions:
  contents: write
  actions: read

concurrency:
  group: nexusleads-medicine-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_FRONTEND_URL: https://leads.sayadbayezid.com

jobs:
  medicine:
    name: Safe automatic repair and Worker deployment
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read Doctor conclusion without exposing raw diagnostics
        id: doctor
        shell: bash
        run: |
          set -euo pipefail
          REPORT="doctor-report/latest.md"
          if [ ! -s "$REPORT" ]; then
            echo "No readable Doctor report is available; no automatic repair will run."
            echo "safe_to_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Fq "Login ও নতুন account blocked: CORS সমস্যা" "$REPORT" \
            && grep -Fq 'cloudflare/wrangler.toml' "$REPORT" \
            && grep -Fq '`21`' "$REPORT" \
            && grep -Fq 'https://leads.sayadbayezid.com' "$REPORT"; then
            echo "Doctor proved the custom-domain CORS issue."
            echo "safe_to_fix=true" >> "$GITHUB_OUTPUT"
          else
            echo "Doctor did not prove a medicine rule that is safe to apply."
            echo "safe_to_fix=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the one safe CORS repair
        id: repair
        if: steps.doctor.outputs.safe_to_fix == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "cloudflare/wrangler.toml" "cloudflare/wrangler-deploy.toml" "$APP_FRONTEND_URL" <<'PY'
          import re
          import sys
          from pathlib import Path

          frontend = sys.argv[3]
          inspected_config = Path(sys.argv[1])
          deploy_config = Path(sys.argv[2])

          # The first file is inspected by Doctor and has an existing vars entry.
          inspected_text = inspected_config.read_text()
          if frontend not in inspected_text:
              match = re.search(r'(?m)^(ALLOWED_ORIGINS\s*=\s*")([^"]*)(")$', inspected_text)
              if not match:
                  raise SystemExit("ALLOWED_ORIGINS was not found in wrangler.toml; refusing to edit.")
              origins = [item.strip() for item in match.group(2).split(",") if item.strip()]
              origins.append(frontend)
              replacement = match.group(1) + ",".join(dict.fromkeys(origins)) + match.group(3)
              inspected_config.write_text(inspected_text[:match.start()] + replacement + inspected_text[match.end():])

          # deploy-backend.yml deploys with wrangler-deploy.toml, so that file
          # must carry the same non-secret CORS variable too.
          deploy_text = deploy_config.read_text()
          if frontend not in deploy_text:
              deploy_match = re.search(r'(?m)^(ALLOWED_ORIGINS\s*=\s*")([^"]*)(")$', deploy_text)
              if deploy_match:
                  origins = [item.strip() for item in deploy_match.group(2).split(",") if item.strip()]
                  origins.append(frontend)
                  replacement = deploy_match.group(1) + ",".join(dict.fromkeys(origins)) + deploy_match.group(3)
                  deploy_text = deploy_text[:deploy_match.start()] + replacement + deploy_text[deploy_match.end():]
              else:
                  separator = "" if deploy_text.endswith("\n") else "\n"
                  deploy_text += separator + "\n[vars]\nALLOWED_ORIGINS = \"https://jennymahmuda.github.io,http://localhost:5173,http://localhost:8787," + frontend + "\"\n"
              deploy_config.write_text(deploy_text)

          print("The production frontend origin is present in both Wrangler configurations.")
          PY
          echo "repair_applied=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the repaired Worker
        if: steps.repair.outputs.repair_applied == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_KEY }}
          accountId: ${{ secrets.CLOUDFLARE_AC_ID }}
          workingDirectory: cloudflare
          wranglerVersion: latest
          command: deploy --config wrangler-deploy.toml

      - name: Commit only the safe application repair
        if: steps.repair.outputs.repair_applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NexusLeads Medicine"
          git config user.email "medicine@noreply.github.com"
          git add cloudflare/wrangler.toml cloudflare/wrangler-deploy.toml
          if git diff --cached --quiet; then
            echo "No application change to commit."
            exit 0
          fi
          git commit -m "fix: allow production frontend origin for API CORS"
          git push origin HEAD:main

      - name: Publish safe medicine summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NexusLeads Medicine"
            echo
            echo "This run applies only evidence-backed, reversible changes. Secret values are never printed or committed."
            echo
            if [ "${{ steps.repair.outputs.repair_applied || 'false' }}" = "true" ]; then
              echo "**Repair applied:** the production frontend origin was added to the API CORS allowlist."
              echo "**Worker deployment:** Medicine deployed the repaired Worker directly with wrangler-deploy.toml."
            else
              echo "**Repair applied:** none; no safe proven rule matched."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
